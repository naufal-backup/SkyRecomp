name: Build & Upload Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish (the release is created if it does not exist)
        required: true
        default: v1.0.6
        type: string
      build_macos:
        description: Also build the macOS release (tag pushes always do)
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  # The release is created first so every platform job can upload to it, whether it exists already (a tag push) or not
  # (a manual run on a branch).
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the release if it is missing
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Sky Recomp $RELEASE_TAG" --generate-notes
          fi

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-24.04
    needs: prepare-release
    timeout-minutes: 240
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The build container compiles SDL3, FFmpeg and shaderc, which needs more room than a runner has by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman patchelf

      # Re-runs keep the pinned source archives and the libraries built from them (build_deps.sh skips what exists).
      - name: Cache Linux build dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/linux/src
            build/linux/x86_64/deps
          key: linux-x86_64-deps-${{ hashFiles('tools/linux/build_deps.sh', 'tools/linux/Containerfile') }}

      - name: Set release version
        run: |
          sed -i.bak "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          grep LARECOMP_VERSION runtime/ui/launcher.mm

      # The release is built in an Ubuntu 22.04 container (tools/linux/appimage.sh): glibc 2.35+ compatible, with the
      # LGPL FFmpeg build, SDL3 and shaderc the app was compiled against shipped inside it. Building on the runner
      # instead links against the runner's FFmpeg 6 (libavformat.so.60), which newer distributions do not have
      # (issue #17).
      - name: Build the AppImage
        run: |
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which rootless podman needs
          if ! podman info >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          PODMAN=podman
          if ! podman info >/dev/null 2>&1; then
            sudo podman info >/dev/null
            PODMAN="sudo -E podman"
            echo "PODMAN_ROOTFUL=1" >> "$GITHUB_ENV"
          fi
          echo "Using podman as: $PODMAN"
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          PODMAN="$PODMAN" tools/linux/appimage.sh x86_64

      # rootful podman writes the mount as root; the next steps run as the runner user
      - name: Fix build tree ownership
        if: env.PODMAN_ROOTFUL == '1'
        run: sudo chown -R "$(id -u):$(id -g)" build

      # The same AppDir as a plain archive for people who cannot run AppImages (no FUSE, Steam launch options, ...):
      # the binary, the bundled libraries and the start screen's game-code toolchain, no system FFmpeg needed.
      - name: Build portable Linux archive
        run: tools/linux/portable.sh x86_64

      - name: List artifacts
        run: ls -lh build/dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyRecomp-${{ env.RELEASE_TAG }}-Linux
          path: build/dist/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/dist/Sky Recomp-${RELEASE_TAG}-linux-x86_64.AppImage" \
            "build/dist/SkyRecomp-${RELEASE_TAG}-Linux-x86_64.tar.gz" \
            --clobber

  build-macos:
    name: Build macOS Release
    runs-on: macos-14
    needs: prepare-release
    if: github.event_name == 'push' || inputs.build_macos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies via Homebrew
        run: |
          brew install sdl3 ffmpeg cmake ninja

      - name: Compile Sky Recomp
        run: |
          sed -i.bak "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          make -j$(sysctl -n hw.ncpu) build/skyrecomp

      - name: Build game setup tools
        run: |
          python3 -m venv build/setup-venv
          build/setup-venv/bin/pip install pyinstaller==6.22.3 capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
          build/setup-venv/bin/python -m PyInstaller --noconfirm --clean --log-level WARN --distpath build/helper --workpath build/pyinstaller tools/lasgen.spec
          bash tools/fetch_zig.sh

      - name: Create macOS App Bundle & DMG
        run: |
          APP="Sky Recomp.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp build/skyrecomp "$APP/Contents/MacOS/skyrecomp"
          strip -S "$APP/Contents/MacOS/skyrecomp"
          cp docs/icon/icon.icns "$APP/Contents/Resources/icon.icns"
          cp docs/icon/icon_1024.png "$APP/Contents/Resources/icon.png"
          [ -f Baloo2-SemiBold.ttf ] && cp Baloo2-SemiBold.ttf "$APP/Contents/Resources/"
          [ -f Baloo2-OFL.txt ] && cp Baloo2-OFL.txt "$APP/Contents/Resources/"
          cp README.md LICENSE CHANGELOG.md "$APP/Contents/Resources/"
          [ -f LICENSE-LASRecomp ] && cp LICENSE-LASRecomp "$APP/Contents/Resources/" || true
          cp -R build/helper/lasgen build/zig "$APP/Contents/Resources/"
          mkdir -p "$APP/Contents/Resources/gamelib-src"
          cp runtime/cpu.h runtime/simd.h runtime/simd_fp.h runtime/gamelib.h tools/gamelib_entry.c runtime/hle/hle_symbols.txt "$APP/Contents/Resources/gamelib-src/"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>skyrecomp</string>
              <key>CFBundleIdentifier</key><string>com.skyrecomp.app</string>
              <key>CFBundleName</key><string>Sky Recomp</string>
              <key>CFBundleDisplayName</key><string>Sky Recomp</string>
              <key>CFBundleIconFile</key><string>icon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${RELEASE_TAG#v}</string>
              <key>CFBundleVersion</key><string>${RELEASE_TAG#v}</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSArchitecturePriority</key><array><string>arm64</string></array>
              <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          # Bundle Homebrew dylibs
          for d in $(otool -L "$APP/Contents/MacOS/skyrecomp" | awk '{print $1}' | grep '/opt/homebrew'); do
            name=$(basename "$d")
            cp "$d" "$APP/Contents/Frameworks/$name" || true
            chmod u+w "$APP/Contents/Frameworks/$name" 2>/dev/null || true
            install_name_tool -change "$d" "@rpath/$name" "$APP/Contents/MacOS/skyrecomp" 2>/dev/null || true
          done
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/skyrecomp" 2>/dev/null || true

          codesign -f -s - "$APP"

          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/Sky Recomp.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Sky Recomp ${RELEASE_TAG}" -srcfolder "$STAGE" -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov SkyRecomp-${RELEASE_TAG}-macOS.dmg
          rm -rf "$STAGE"
          zip -r SkyRecomp-${RELEASE_TAG}-macOS.zip "$APP"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" SkyRecomp-${RELEASE_TAG}-macOS.dmg SkyRecomp-${RELEASE_TAG}-macOS.zip --clobber
