name: Build & Upload Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish (the release is created if it does not exist)
        required: true
        default: v1.0.6
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  # Fork skyrecomp-mouse-support: releases are Linux only (the upstream macOS job was removed here).
  # The release is created first so every platform job can upload to it, whether it exists already (a tag push) or not
  # (a manual run on a branch).
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the release if it is missing
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Sky Recomp $RELEASE_TAG" --generate-notes
          fi

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-24.04
    needs: prepare-release
    timeout-minutes: 240
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The build container compiles SDL3, FFmpeg and shaderc, which needs more room than a runner has by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman patchelf

      # Re-runs keep the pinned source archives and the libraries built from them (build_deps.sh skips what exists).
      - name: Cache Linux build dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/linux/src
            build/linux/x86_64/deps
          key: linux-x86_64-deps-${{ hashFiles('tools/linux/build_deps.sh', 'tools/linux/Containerfile') }}

      - name: Set release version
        run: |
          sed -i.bak "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          grep LARECOMP_VERSION runtime/ui/launcher.mm

      # The release is built in an Ubuntu 22.04 container (tools/linux/appimage.sh): glibc 2.35+ compatible, with the
      # LGPL FFmpeg build, SDL3 and shaderc the app was compiled against shipped inside it. Building on the runner
      # instead links against the runner's FFmpeg 6 (libavformat.so.60), which newer distributions do not have
      # (issue #17).
      - name: Build the AppImage
        run: |
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which rootless podman needs
          if ! podman info >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          PODMAN=podman
          if ! podman info >/dev/null 2>&1; then
            sudo podman info >/dev/null
            PODMAN="sudo -E podman"
            echo "PODMAN_ROOTFUL=1" >> "$GITHUB_ENV"
          fi
          echo "Using podman as: $PODMAN"
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          PODMAN="$PODMAN" tools/linux/appimage.sh x86_64

      # rootful podman writes the mount as root; the next steps run as the runner user
      - name: Fix build tree ownership
        if: env.PODMAN_ROOTFUL == '1'
        run: sudo chown -R "$(id -u):$(id -g)" build

      # The same AppDir as a plain archive for people who cannot run AppImages (no FUSE, Steam launch options, ...):
      # the binary, the bundled libraries and the start screen's game-code toolchain, no system FFmpeg needed.
      - name: Build portable Linux archive
        run: tools/linux/portable.sh x86_64

      - name: List artifacts
        run: ls -lh build/dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyRecomp-${{ env.RELEASE_TAG }}-Linux
          path: build/dist/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/dist/Sky Recomp-${RELEASE_TAG}-linux-x86_64.AppImage" \
            "build/dist/SkyRecomp-${RELEASE_TAG}-Linux-x86_64.tar.gz" \
            --clobber

